<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game - Compact D-Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <div id="score-board">Score: <span id="score-val">0</span></div>
        
        <!-- Game Area Canvas -->
        <div id="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Action / Interface Controls -->
        <div id="menu-controls">
            <button id="btn-start">Start Game</button>
        </div>
        
        <!-- Compact Cross D-Pad (Hidden on Desktop) -->
        <div id="mobile-controls">
            <div class="control-row">
                <button class="control-btn" id="btn-up">▲</button>
            </div>
            <div class="control-row middle-row">
                <button class="control-btn" id="btn-left">◀</button>
                <div class="dpad-spacer"></div>
                <button class="control-btn" id="btn-right">▶</button>
            </div>
            <div class="control-row">
                <button class="control-btn" id="btn-down">▼</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
